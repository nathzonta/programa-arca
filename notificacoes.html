<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interessados - Programa Arca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/interno.css">
    <link rel="icon" href="./assets/imgs/favicon.svg" type="image/svg+xml">
</head>
<body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>

    <div class="app">
        <aside class="menu" id="menu"></aside>
        <div class="veu" id="veu" hidden></div>

        <div class="principal">
            <header class="barra-mobile" id="barra-mobile"></header>

            <main class="conteudo" id="conteudo">
                <div class="cabecalho-pagina entrada">
                    <div>
                        <span class="sobrelinha">Adoção</span>
                        <h1>Pessoas que querem <em>adotar</em></h1>
                        <p>Cada interesse demonstrado pelos animais da sua organização chega aqui, com o contato da pessoa.</p>
                    </div>
                    <button type="button" class="botao botao--contorno" id="btn-marcar-todas" hidden>
                        <svg class="icone" aria-hidden="true"><use href="./assets/imgs/icons/sprite.svg#check"></use></svg>
                        Marcar todas como lidas
                    </button>
                </div>

                <div class="entrada" style="--i:1" id="notif-list" aria-live="polite"></div>
            </main>

            <footer class="rodape-interno">© 2026 Programa Arca · Prefeitura da Serra</footer>
        </div>
    </div>

    <script src="./assets/js/funcoes.js"></script>
    <script src="./assets/js/conexao_bd.js"></script>
    <script src="./assets/js/sistema.js"></script>
    <script src="./assets/js/notificacoes.js"></script>
</body>
</html>
