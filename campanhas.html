<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campanhas - Programa Arca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/interno.css">
    <link rel="icon" href="./assets/imgs/favicon.svg" type="image/svg+xml">
</head>
<body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>

    <div class="app">
        <aside class="menu" id="menu"></aside>
        <div class="veu" id="veu" hidden></div>

        <div class="principal">
            <header class="barra-mobile" id="barra-mobile"></header>

            <main class="conteudo" id="conteudo">
                <div class="cabecalho-pagina entrada">
                    <div>
                        <span class="sobrelinha">Campanhas</span>
                        <h1>O que está <em>acontecendo</em> na cidade</h1>
                        <p>Castração, vacinação e feiras de adoção organizadas pelo programa e pelas organizações parceiras.</p>
                    </div>
                </div>

                <div class="filtros entrada" style="--i:1">
                    <div>
                        <p class="campo__rotulo" id="rotulo-filtro-tipo">Objetivo</p>
                        <div class="chips" id="filtro-tipo" role="group" aria-labelledby="rotulo-filtro-tipo">
                            <button type="button" class="chip" data-tipo="" aria-pressed="true">Todas</button>
                            <button type="button" class="chip" data-tipo="Castração" aria-pressed="false">Castração</button>
                            <button type="button" class="chip" data-tipo="Vacinação" aria-pressed="false">Vacinação</button>
                            <button type="button" class="chip" data-tipo="Feira de Adoção" aria-pressed="false">Feira de Adoção</button>
                        </div>
                    </div>
                </div>

                <div id="campanhas-grid" aria-live="polite"></div>
            </main>

            <footer class="rodape-interno">© 2026 Programa Arca · Prefeitura da Serra</footer>
        </div>
    </div>

    <script src="./assets/js/funcoes.js"></script>
    <script src="./assets/js/conexao_bd.js"></script>
    <script src="./assets/js/sistema.js"></script>
    <script src="./assets/js/campanhas.js"></script>
</body>
</html>
