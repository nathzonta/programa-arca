<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritados - Programa Arca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/interno.css">
    <link rel="icon" href="./assets/imgs/favicon.svg" type="image/svg+xml">
</head>
<body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>

    <div class="app">
        <aside class="menu" id="menu"></aside>
        <div class="veu" id="veu" hidden></div>

        <div class="principal">
            <header class="barra-mobile" id="barra-mobile"></header>

            <main class="conteudo" id="conteudo">
                <div class="cabecalho-pagina entrada">
                    <div>
                        <span class="sobrelinha">Adoção</span>
                        <h1>Os que <em>ficaram</em> no seu coração</h1>
                        <p>Seus animais favoritados ficam aqui para você decidir com calma.</p>
                    </div>
                </div>

                <form class="filtros entrada" style="--i:1" role="search" aria-label="Filtrar favoritos" onsubmit="return false">
                    <div class="campo filtros__busca">
                        <label for="filtro-nome">Nome</label>
                        <svg class="icone" aria-hidden="true"><use href="./assets/imgs/icons/sprite.svg#busca"></use></svg>
                        <input type="search" id="filtro-nome" placeholder="Buscar pelo nome">
                    </div>
                    <div class="campo">
                        <label for="filtro-porte">Porte</label>
                        <select id="filtro-porte">
                            <option value="">Todos os portes</option>
                            <option value="pequeno">Pequeno</option>
                            <option value="medio">Médio</option>
                            <option value="grande">Grande</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="filtro-sexo">Sexo</label>
                        <select id="filtro-sexo">
                            <option value="">Todos</option>
                            <option value="macho">Macho</option>
                            <option value="femea">Fêmea</option>
                        </select>
                    </div>
                </form>

                <div id="favoritados-grid" aria-live="polite"></div>
            </main>

            <footer class="rodape-interno">© 2026 Programa Arca · Prefeitura da Serra</footer>
        </div>
    </div>

    <script src="./assets/js/funcoes.js"></script>
    <script src="./assets/js/selecao.js"></script>
    <script src="./assets/js/conexao_bd.js"></script>
    <script src="./assets/js/sistema.js"></script>
    <script src="./assets/js/favoritados.js"></script>
</body>
</html>
